<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f3ed" />
    <meta
      name="description"
      content="Lightwell, Yatu's private-feeling NYC home scout for rentals, sublets, subway access, and commute context."
    />
    <link rel="canonical" href="https://yatu.xyz/lightwell/" />
    <title>Lightwell — NYC home scout</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
        background: #f5f3ed;
        color: #20251f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      iframe {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
      }

      .loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }

      .loading strong {
        display: block;
        margin-bottom: 8px;
        font-family: Georgia, serif;
        font-size: clamp(26px, 5vw, 54px);
        font-weight: 400;
      }

      .loading a {
        color: #1f563e;
      }

      iframe {
        position: relative;
        z-index: 1;
        display: block;
        border: 0;
        background: #f5f3ed;
      }
    </style>
  </head>
  <body>
    <div class="loading">
      <div>
        <strong>Opening Lightwell…</strong>
        <span>
          If it does not appear,
          <a href="https://lightwell-nyc-home-scout.thecpe.chatgpt.site/">open the housing scout directly</a>.
        </span>
      </div>
    </div>
    <iframe
      src="https://lightwell-nyc-home-scout.thecpe.chatgpt.site/"
      title="Lightwell NYC home scout"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  </body>
</html>
